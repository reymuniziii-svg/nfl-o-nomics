# etl/pins.toml — GENERATED by `python -m etl.pipeline`. Do not hand-edit.
#
# DECISIONS 8: nflverse assets are pinned to a NAMED RELEASE TAG, never
# `latest`. Bumping a pin is an explicit commit that re-runs the golden
# tests (ARCHITECTURE §4.4). See etl/pins.py for the documented checksum
# gap and why the remote-scan design (DECISIONS 7) leaves it open.

[meta]
generated_by = "python -m etl.pipeline"
checksum_status = "not recorded — see etl/pins.py; assets are scanned remotely and data/raw/ stays empty, so no file ever lands to hash"
drift_detection = "named tag + exact projected column set + observed row count + the 18 golden tests"

[data_version]
coaching_window = "2000-2025"
dead_money_resolved_rows = 316
draft_window = "2000-2025"
excluded_season = 2026
league_cap_window = "1994-2025"
perf_window = "1999-2025"
tier2_window = "2013-2025"

[assets.contracts]
tag = "contracts"
url = "https://github.com/nflverse/nflverse-data/releases/download/contracts/historical_contracts.parquet"
projected_columns = "* (the nested `cols` list is unnested and deduped in DuckDB)"
observed_rows_consumed = 41976
window = "2013-2025"
consumed_by = ["team_season_cap"]
note = "OTC-derived. `cols` is a PLAYER-level career table replicated onto every contract row — dedupe on (otc_id, year) or team totals inflate 3-7x (DATA_AUDIT §6 trap 1)."

[assets.draft_picks]
tag = "draft_picks"
url = "https://github.com/nflverse/nflverse-data/releases/download/draft_picks/draft_picks.parquet"
projected_columns = "season, round, pick, team, gsis_id, pfr_player_id, pfr_player_name, position, side, college, hof, allpro, probowls, seasons_started, w_av, games"
observed_rows_consumed = 6644
window = "2000-2025"
consumed_by = ["draft_pick"]
note = "`car_av` is 100% null and deliberately NOT projected (DECISIONS 40). Team codes are PFR boxscore codes."

[assets.games]
tag = "master"
url = "https://raw.githubusercontent.com/nflverse/nfldata/master/data/games.csv"
projected_columns = "season, game_type, week, home_team, away_team, home_score, away_score"
observed_rows_consumed = 6967
window = "1999-2025 REG"
consumed_by = ["team_season_results"]
note = "NOT A RELEASE ASSET — nfldata serves games.csv from the master branch, so there is no tag to pin and `branch = master` is the honest record. Carries 272 unplayed 2026 rows; every mart clips."

[assets.pbp]
tag = "pbp"
url = "https://github.com/nflverse/nflverse-data/releases/download/pbp/play_by_play_{year}.parquet"
projected_columns = "season, season_type, posteam, defteam, play_type, epa"
observed_rows_consumed = 870208
window = "1999-2025 REG pass+run"
consumed_by = ["team_season_epa"]
note = "372 columns in the file; we read six. One file per season."

[assets.pbp_production]
tag = "pbp"
url = "https://github.com/nflverse/nflverse-data/releases/download/pbp/play_by_play_{year}.parquet"
projected_columns = "season, season_type, week, play_type, posteam, defteam, two_point_attempt, passer_player_id, rusher_player_id, receiver_player_id, pass_attempt, complete_pass, passing_yards, pass_touchdown, interception, sack, rush_attempt, rushing_yards, rush_touchdown, receiving_yards, sack_player_id, half_sack_1_player_id, half_sack_2_player_id, interception_player_id, solo_tackle_1_player_id, solo_tackle_1_team, solo_tackle_2_player_id, solo_tackle_2_team, assist_tackle_1_player_id, assist_tackle_1_team, assist_tackle_2_player_id, assist_tackle_2_team, assist_tackle_3_player_id, assist_tackle_3_team, assist_tackle_4_player_id, assist_tackle_4_team"
observed_rows_consumed = 1225182
window = "1999-2025 REG"
consumed_by = ["player_season_production"]
note = "THE SAME per-season asset as [assets.pbp], scanned a second time with a wider projection for player_season_production. Pinned separately because what this file pins is the exact projected column set per scan (RISKS 6, schema drift) — folding two different projections into one entry would pin neither."

[assets.players]
tag = "players"
url = "https://github.com/nflverse/nflverse-data/releases/download/players/players.parquet"
projected_columns = "otc_id, gsis_id, pfr_id, display_name"
observed_rows_consumed = 9338
window = "2013-2025"
consumed_by = ["player_season_cap"]
note = "The crosswalk hub. The ONLY file carrying otc_id, and the only bridge from gsis_id to snap counts' pfr_id (DECISIONS 38)."

[assets.snap_counts]
tag = "snap_counts"
url = "https://github.com/nflverse/nflverse-data/releases/download/snap_counts/snap_counts_{year}.parquet"
projected_columns = "season, game_type, game_id, player, pfr_player_id, team, offense_snaps, offense_pct, defense_snaps, st_snaps"
observed_rows_consumed = 310475
window = "2013-2025 REG"
consumed_by = ["player_season_availability"]
note = "One file per season. The 2012 asset returns HTTP 200 and ZERO rows — the pipeline asserts it is still empty rather than trusting the 2013 boundary constant (DECISIONS 37)."
