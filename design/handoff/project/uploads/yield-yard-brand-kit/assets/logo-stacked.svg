<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 620" role="img" aria-labelledby="title desc">
  <title id="title">YIELD/YARD stacked logo</title>
  <desc id="desc">Stacked YIELD/YARD wordmark with rising data bars.</desc>
  <rect width="650" height="620" fill="#FFFFFF"></rect>
  <g transform="translate(150 65)">
    <rect x="0" y="120" width="38" height="70" fill="#76A51D"></rect>
    <rect x="60" y="95" width="38" height="95" fill="#82B720"></rect>
    <rect x="120" y="65" width="38" height="125" fill="#8DC624"></rect>
    <rect x="180" y="28" width="38" height="162" fill="#99D629"></rect>
    <rect x="240" y="0" width="38" height="190" fill="#A6E22E"></rect>
    <path d="M8 100L76 76L136 45L196 12L258 -20" fill="none" stroke="#071C16" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"></path>
    <circle cx="8" cy="100" r="7" fill="#071C16"></circle><circle cx="76" cy="76" r="7" fill="#071C16"></circle><circle cx="136" cy="45" r="7" fill="#071C16"></circle><circle cx="196" cy="12" r="7" fill="#071C16"></circle><circle cx="258" cy="-20" r="7" fill="#071C16"></circle>
  </g>
  <g font-family="&#39;Bebas Neue&#39;,&#39;Arial Narrow&#39;,sans-serif" font-weight="700" letter-spacing="6" font-size="142">
    <text x="325" y="360" text-anchor="middle" fill="#071C16">YIELD</text>
    <text x="110" y="500" fill="#A6E22E">/</text>
    <text x="195" y="500" fill="#071C16">YARD</text>
  </g>
  <text x="325" y="565" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="700" letter-spacing="7" fill="#B78317">DATA. INSIGHT. YIELD.</text>
</svg>